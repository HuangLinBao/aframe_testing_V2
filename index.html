<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>C_Center test ||</title>
        <link rel="stylesheet" href="style.css">

        <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
        <script>
            delete AFRAME.components["grabbable"];
        </script>
        <script src="https://cdn.jsdelivr.net/npm/handy-work/build/handy-controls.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/handy-work/build/magnet-helpers.min.js"></script>
        <script
            src="https://unpkg.com/aframe-environment-component@1.5.x/dist/aframe-environment-component.min.js"></script>

        <script src="https://unpkg.com/aframe-troika-text/dist/aframe-troika-text.min.js"></script>
        <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>
        <script src="https://unpkg.com/super-hands@^3.0.5/dist/super-hands.min.js"></script>
        <script
            src="https://unpkg.com/aframe-event-set-component@5.0.0/dist/aframe-event-set-component.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/aframe-blink-controls/dist/aframe-blink-controls.min.js"></script>
        <script
            src="https://unpkg.com/aframe-render-order-component@1.1.0/dist/aframe-render-order-component.min.js"></script>
        <script src="https://unpkg.com/aframe-log-component/dist/aframe-log-component.min.js"></script>

        <script src="https://unpkg.com/aframe-look-at-component@^1.0.0/dist/aframe-look-at-component.min.js"></script>
        <script src="components/aframe-html.min.js"></script>

        <script src="components/fx.js"></script>
        <script src="components/super-integration.js"></script>
        <script src="shaders/aurora-shader.js"></script>
        <script>
            window.addEventListener("DOMContentLoaded", function () {
                const sceneEl = document.querySelector("a-scene");
            });
        </script>

    </head>

    <body>
        <a-scene
            environment=" preset:default;ground: flat; groundTexture: none; lighting: distant; shadow: false; fog: 0.1"
            renderer="antialias: true" loading-screen="enabled: false" vr-mode-ui="enterVRButton: #enter-vr-button"
            webxr="optionalFeatures: hand-tracking,local-floor; overlayElement:#dom-overlay;" ar-cursor
            super-integration="rightRay: #rightRay; leftRay: #leftRay; debug: true">

            <a-assets timeout="10000">

                <!-- Models -->
                <a-asset-item id="sword" src="assets/models/sword/scene.gltf" preload="true"></a-asset-item>
                <a-asset-item id="sword_glb" src="assets/models/sword_glb/scene.glb" preload="true"></a-asset-item>
                <a-asset-item id="chaos_orb" src="assets/models/chaos_orb/scene.gltf" preload="true"></a-asset-item>
                <a-asset-item id="magical_orb" src="assets/models/magical_orb/scene.gltf" preload="true"></a-asset-item>
                <a-asset-item id="time_chamber" src="assets/models/time_chamber/scene.gltf"
                    preload="true"></a-asset-item>
                <a-asset-item id="watch" src="assets/models/watch/scene.glb" preload="true"></a-asset-item>

                <!-- Textures -->
                <!-- Floor -->

                <img id="floor_glass" src="assets/img/textures/Glass_webp/TCom_GlassFrostedLines_1K_albedo.webp">
                <img id="floor_glass_nrm" src="assets/img/textures/Glass_webp/TCom_GlassFrostedLines_1K_normal.webp">
                <img id="floor_glass_ao" src="assets/img/textures/Glass_webp/TCom_GlassFrostedLines_1K_ao.webp">
                <img id="floor_glass_height" src="assets/img/textures/Glass_webp/TCom_GlassFrostedLines_1K_height.webp">
                <img id="floor_glass_roughness"
                    src="assets/img/textures/Glass_webp/TCom_GlassFrostedLines_1K_roughness.webp">
                <img id="floor_glass_metallic"
                    src="assets/img/textures/Glass_webp/TCom_GlassFrostedLines_1K_metallic.webp">

                <!-- Fonts -->
                <a-asset-item id="pixel-ar" src="assets/Fonts/29LT_Arapix/29LTArapix-Regular.otf"></a-asset-item>

                <!-- Templates for super-hands -->
                <template id="button-template">
                    <a-entity>
                        <a-box class="clickable" width="0.2" height="0.08" depth="0.01"></a-box>
                    </a-entity>
                </template>
            </a-assets>

            <!-- Floor -->
            <a-plane material="src: #floor_glass;
                repeat: 27 27;
                normalMap: #floor_glass_nrm;
                normalTextureRepeat: 27 27;
                ambientOcclusionMap: #floor_glass_ao;
                ambientOcclusionTextureRepeat: 27 27;
                displacementMap: #floor_glass_height;
                displacementTextureRepeat: 27 27;
                displacementBias: -0.02;
                displacementScale: 0.05;
                roughnessMap: #floor_glass_roughness;
                roughnessTextureRepeat: 27 27;
                roughness: 0.7;
                opacity: 0.8;
                metalnessMap: #floor_glass_metallic;
                metalness: 0.1;
                metalnessTextureRepeat: 27 27;
                emissive: #2e2e2e;
                color: #949494;
                side: double" width="67.5" height="67.5" position="0 0.02 0" scale="3 3 1" rotation="-90 0 0">
            </a-plane>

            <!-- Aurora Sky -->
            <a-entity position="0 35.000 0" geometry="primitive: sphere; radius: 54.200;" material="shader: aurora-shader; 
                                transparent: false; 
                                side: back;
                                iTime: 0;
                                iResolution: 2048 2048;
                                iMouse: 1024 1024;" aurora-animator scale="3 3 3"></a-entity>

            <!-- Environment -->
            <!-- Time Chamber -->
            <a-entity id="time_chamber" gltf-model="#time_chamber" position="0 0.00 45" visible="true"
                rotation="0 -150 0" scale="0.2 0.2 0.2"></a-entity>

            <!-- Test object - Sphere (Super-Hands + Manual Events) -->
            <a-sphere id="interactive-test-sphere" class="hoverable grabbable" position="2 1.5 -1.8" radius="0.3"
                color="#ff6b6b" material="transparent: true; opacity: 0.8" hoverable grabbable
                event-set__hover-visual="event: hover-start; material.color: #00ff00; material.emissive: #002200"
                event-set__unhover-visual="event: hover-end; material.color: #ff6b6b; material.emissive: #000000"
                event-set__grabbed-visual="event: grab-start; material.color: #ffaa00; material.emissive: #440000; scale: 1.2 1.2 1.2"
                event-set__released-visual="event: grab-end; material.color: #ff6b6b; material.emissive: #000000; scale: 1 1 1"
                animation__mouseenter="property: color; to: #00ff00; startEvents: mouseenter; dur: 200"
                animation__mouseleave="property: color; to: #ff6b6b; startEvents: mouseleave; dur: 200">

                <!-- Label -->
                <a-text value="🔴 Super-Hands Sphere!\nPinch to grab & drag\n🤏 Event-Set Triggered" position="0 0.6 0"
                    align="center" color="#ffffff" scale="0.5 0.5 0.5" look-at="[camera]">
                </a-text>

                <!-- Grab indicator ring -->
                <a-ring radius-inner="0.31" radius-outer="0.33"
                    material="color: #00ff00; opacity: 0.4; transparent: true"
                    animation="property: rotation; to: 0 0 360; dur: 6000; loop: true">
                </a-ring>

                <!-- Grab status indicator -->
                <a-sphere radius="0.05" position="0 0.4 0" color="#ff0000" visible="false"
                    event-set__show-grabbed="event: grab-start; visible: true"
                    event-set__hide-released="event: grab-end; visible: false">
                </a-sphere>
            </a-sphere>

            <!-- Test object - Stretchable Plane -->
            <a-plane id="interactive-test-plane" class="hoverable stretchable" position="2 1.5 0" width="1"
                rotation="0 -90 0" height="1" color="#9b59b6" material="transparent: true; opacity: 0.8" hoverable
                stretchable
                event-set__hover-visual="event: hover-start; material.color: #00ff00; material.emissive: #002200"
                event-set__unhover-visual="event: hover-end; material.color: #9b59b6; material.emissive: #000000"
                event-set__stretched-visual="event: stretch-start; material.color: #ff6600; material.emissive: #660000"
                event-set__unstretched-visual="event: stretch-end; material.color: #9b59b6; material.emissive: #000000">

                <!-- Label -->
                <a-text value="🟣 Stretchable Plane!\nSingle-hand stretch test\n✋ Point + Pinch = Stretch"
                    position="0 0.7 0.01" align="center" color="#ffffff" scale="0.6 0.6 0.6" look-at="[camera]">
                </a-text>

                <!-- Stretch indicators -->
                <a-ring radius-inner="0.45" radius-outer="0.50" position="-0.3 0 0.01"
                    material="color: #ff0066; opacity: 0.6; transparent: true"
                    animation="property: rotation; to: 0 0 360; dur: 3000; loop: true">
                </a-ring>
                <a-ring radius-inner="0.45" radius-outer="0.50" position="0.3 0 0.01"
                    material="color: #ff0066; opacity: 0.6; transparent: true"
                    animation="property: rotation; to: 0 0 -360; dur: 3000; loop: true">
                </a-ring>

                <!-- Stretch status indicator -->
                <a-sphere radius="0.06" position="0 0.4 0.01" color="#ff0000" visible="false"
                    event-set__show-stretched="event: stretch-start; visible: true"
                    event-set__hide-unstretched="event: stretch-end; visible: false">
                </a-sphere>

                <!-- Hand position indicators -->
                <a-sphere radius="0.03" position="-0.3 0 0.01" color="#0066ff" visible="false" id="left-hand-indicator">
                </a-sphere>
                <a-sphere radius="0.03" position="0.3 0 0.01" color="#ff0066" visible="false" id="right-hand-indicator">
                </a-sphere>
            </a-plane>

            <!-- HTML App Bar Panel (Left Side) -->
            <a-entity id="app-bar-panel" position="-1.5 1.8 0" look-at="[camera]" width="2" height="1" scale="2 2 2"
                material="color: #ffffff; transparent: true; opacity: 0.02; side: double"
                html="html: #app-bar-interface; cursor: #cursor">
            </a-entity>

            <!-- VR Feedback Form Panel (Right Side) -->
            <a-entity id="vr-form-panel" position="-1.5 1.8 1.200" look-at="[camera]" width="2" height="1.8"
                scale="2 2 2" material="color: #ffffff; transparent: true; opacity: 0.02; side: double"
                html="html: #vr-form-interface; cursor: #cursor">
            </a-entity>

            <a-entity id="sword" data-pick-up class="magnet-left magnet-right" gltf-model="#sword_glb"
                position="0 1.5 -0.6" scale="0.1 0.1 0.1"
                animation__restore_position="startEvents:putdown;pauseEvents:pickup;property:position;to:0 1.5 -0.6;easing:easeOutBack;"
                animation__restore_rotation="startEvents:putdown;pauseEvents:pickup;property:rotation;to:-30 180 0;easing:easeOutBack;">
            </a-entity>


            <!-- <a-entity>
                <a-entity id="sword" gltf-model="#sword" visible="true" position="-3.186 -6.176 0.557"
                    geometry="primitive: box; width: 1; height: 5; depth: 1" material="visible: false"></a-entity>
            </a-entity> -->

            <a-entity id="player" position="0 0.5 0" movement-controls="acceleration: 50; easing: 40"
                wasd-controls="acceleration: 50; easing: 40">

                <!-- Camera -->
                <a-entity camera look-controls>
                    <a-entity super-hands cursor="rayOrigin: mouse"
                        raycaster="objects: .clickable, .hoverable, .grabbable; far: 5" position="0 0 -0.01">
                    </a-entity>
                </a-entity>

                <!-- Hand Controls (manages both hands) -->
                <a-entity id="handController" handy-controls>
                    <!-- Screen space inputs like mobile AR -->
                    <a-torus radius="0.008" radius-tubular="0.001" material="shader:flat;color:blue"
                        data-none="screen-0"></a-torus>
                    <a-torus radius="0.008" radius-tubular="0.001" material="shader:flat;color:green"
                        data-none="screen-1"></a-torus>
                    <a-torus radius="0.008" radius-tubular="0.001" material="shader:flat;color:red"
                        data-none="screen-2"></a-torus>

                    <!-- Objects attached to tracked hand joints -->
                    <a-gltf-model src="#watch" data-left="wrist" position="-1000 0 0" scale="0.038 0.038 0.038">
                        <a-sphere radius="0.02" position="0 0.02 0"
                            sphere-collider="radius:0.02;objects:[data-right$=-tip];" exit-on="hitend"
                            visible="false"></a-sphere>
                    </a-gltf-model>
                    <a-entity data-left="ring-finger-phalanx-proximal">
                        <a-torus position="0 0 -0.03" radius="0.008" radius-tubular="0.001" scale="1 1 1.5"
                            material="color:gold;metalness:1;roughness:0;"></a-torus>
                    </a-entity>

                    <!-- Ray and Grip are Available on Hands or Tracked Inputs -->
                    <a-entity id="rightRay" data-right="ray" mixin="blink" cursor=""
                        raycaster="objects:[html], .clickable, .hoverable, .grabbable;far:5;showLine:true;lineColor:red;"
                        super-hands="colliderEvent:raycaster-intersected;
                                   colliderEventProperty:els;
                                   colliderEndEvent:raycaster-intersected-cleared;
                                   colliderEndEventProperty:clearedEls;">
                    </a-entity>
                    <a-entity id="leftRay" data-left="ray" mixin="blink" cursor=""
                        raycaster="objects:[html], .clickable, .hoverable, .grabbable;far:5;showLine:true;lineColor:blue;"
                        super-hands="colliderEvent:raycaster-intersected;
                                   colliderEventProperty:els;
                                   colliderEndEvent:raycaster-intersected-cleared;
                                   colliderEndEventProperty:clearedEls;">
                    </a-entity>
                    <!-- These get drawn towards grabable objects, moving the whole hand and the attached elements-->
                    <a-entity id="left-magnet" data-left="grip" data-magnet="magnet-left"
                        grab-magnet-target="startEvents:squeezestart,pose_fist;stopEvents:pose_flat_fuseShort,squeezeend;noMagnetEl:#left-no-magnet;"></a-entity>
                    <a-entity id="right-magnet" data-right="grip" data-magnet="magnet-right"
                        grab-magnet-target="startEvents:squeezestart,pose_fist;stopEvents:pose_flat_fuseShort,squeezeend;noMagnetEl:#right-no-magnet;"></a-entity>


                    <a-entity id="left-no-magnet" data-left="grip" data-no-magnet>
                        <a-entity html="html:#my-interface;cursor:#cursor" position="-0.142 -0.0166 -0.02928"
                            rotation="-80 90 0" scale="0.7 0.7 0.7"></a-entity>
                    </a-entity>


                    <!-- Invisible objects at the tips of each finger for physics or intersections -->
                    <a-sphere data-right="index-finger-tip" radius="0.01" visible="false"></a-sphere>
                    <a-sphere data-right="middle-finger-tip" radius="0.01" visible="false"></a-sphere>
                    <a-sphere data-right="ring-finger-tip" radius="0.01" visible="false"></a-sphere>
                    <a-sphere data-right="pinky-finger-tip" radius="0.01" visible="false"></a-sphere>
                    <a-sphere data-right="thumb-tip" radius="0.01" visible="false"></a-sphere>
                    <a-sphere data-left="index-finger-tip" radius="0.01" visible="false"></a-sphere>
                    <a-sphere data-left="middle-finger-tip" radius="0.01" visible="false"></a-sphere>
                    <a-sphere data-left="ring-finger-tip" radius="0.01" visible="false"></a-sphere>
                    <a-sphere data-left="pinky-finger-tip" radius="0.01" visible="false"></a-sphere>
                    <a-sphere data-left="thumb-tip" radius="0.01" visible="false"></a-sphere>
                </a-entity>
            </a-entity>
            <a-sphere color="black" radius="0.005" id="cursor" material="shader:flat" visible="false"></a-sphere>

        </a-scene>

        <!-- App Bar HTML Section (Simplified to prevent z-fighting) -->
        <div id="app-bar-interface" style="
            width: 400px; 
            height: 600px; 
            background: #667eea;
            border: 3px solid #764ba2;
            overflow: hidden;
            font-family: Arial, sans-serif;
        ">
            <!-- App Bar Header -->
            <div style="
                background: #5a67d8;
                padding: 16px 20px;
                border-bottom: 3px solid #764ba2;
                display: flex;
                align-items: center;
                justify-content: space-between;
            ">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <div style="
                        width: 32px; 
                        height: 32px; 
                        background: #ff6b6b; 
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        color: white;
                        font-weight: bold;
                        font-size: 16px;
                    ">VR</div>
                    <h2 style="margin: 0; color: white; font-size: 18px;">Control Panel</h2>
                </div>
                <div style="color: white; font-size: 14px;">12:34 PM</div>
            </div>

            <!-- Navigation Menu -->
            <div style="padding: 20px; background: #667eea;">
                <h3 style="color: white; margin: 0 0 16px 0; font-size: 16px;">Navigation</h3>
                <div style="display: flex; flex-direction: column; gap: 12px;">
                    <button onclick="console.log('Home clicked')" style="
                        background: #5a67d8;
                        border: 2px solid #4c63d2;
                        color: white;
                        padding: 12px 16px;
                        cursor: pointer;
                        font-size: 14px;
                    " onmouseover="this.style.background='#4c63d2'" onmouseout="this.style.background='#5a67d8'">
                        🏠 Home
                    </button>
                    <button onclick="console.log('Settings clicked')" style="
                        background: #5a67d8;
                        border: 2px solid #4c63d2;
                        color: white;
                        padding: 12px 16px;
                        cursor: pointer;
                        font-size: 14px;
                    " onmouseover="this.style.background='#4c63d2'" onmouseout="this.style.background='#5a67d8'">
                        ⚙️ Settings
                    </button>
                    <button onclick="console.log('Tools clicked')" style="
                        background: #5a67d8;
                        border: 2px solid #4c63d2;
                        color: white;
                        padding: 12px 16px;
                        cursor: pointer;
                        font-size: 14px;
                    " onmouseover="this.style.background='#4c63d2'" onmouseout="this.style.background='#5a67d8'">
                        🔧 Tools
                    </button>
                </div>
            </div>

            <!-- Quick Actions -->
            <div style="padding: 0 20px 20px; background: #667eea;">
                <h3 style="color: white; margin: 0 0 16px 0; font-size: 16px;">Quick Actions</h3>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                    <button onclick="AFRAME.scenes[0].enterVR()" style="
                        background: #2ed573;
                        border: 2px solid #26d464;
                        color: white;
                        padding: 16px 12px;
                        cursor: pointer;
                        font-size: 12px;
                        font-weight: bold;
                    " onmouseover="this.style.background='#26d464'" onmouseout="this.style.background='#2ed573'">
                        🥽 Enter VR
                    </button>
                    <button onclick="AFRAME.scenes[0].exitVR()" style="
                        background: #ff6b6b;
                        border: 2px solid #ff5252;
                        color: white;
                        padding: 16px 12px;
                        cursor: pointer;
                        font-size: 12px;
                        font-weight: bold;
                    " onmouseover="this.style.background='#ff5252'" onmouseout="this.style.background='#ff6b6b'">
                        🚪 Exit VR
                    </button>
                </div>
            </div>

            <!-- Status Panel -->
            <div style="
                margin: 0 20px 20px;
                background: #5a67d8;
                border: 2px solid #4c63d2;
                padding: 16px;
            ">
                <h4 style="color: white; margin: 0 0 12px 0; font-size: 14px;">System Status</h4>
                <div style="display: flex; flex-direction: column; gap: 8px;">
                    <div style="display: flex; justify-content: space-between; color: white; font-size: 12px;">
                        <span>Hand Tracking:</span>
                        <span style="color: #2ed573;">🟢 Active</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; color: white; font-size: 12px;">
                        <span>Controllers:</span>
                        <span style="color: #ff6b6b;">🔴 Offline</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; color: white; font-size: 12px;">
                        <span>Tracking:</span>
                        <span style="color: #ffa502;">🟡 6DOF</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- VR Feedback Form HTML Section -->
        <div id="vr-form-interface" style="
            width: 400px; 
            height: 600px; 
            background: #ffffff;
            border: 3px solid #4285f4;
            overflow: hidden;
            font-family: Arial, sans-serif;
        ">
            <!-- Iframe Header -->
            <div style="
                background: #4285f4;
                padding: 16px 20px;
                border-bottom: 3px solid #1a73e8;
                display: flex;
                align-items: center;
                justify-content: space-between;
            ">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <div style="
                        width: 32px; 
                        height: 32px; 
                        background: #ffffff; 
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        color: #4285f4;
                        font-weight: bold;
                        font-size: 16px;
                    ">📝</div>
                    <h2 style="margin: 0; color: white; font-size: 18px;">VR Feedback Form</h2>
                </div>
                <div style="color: white; font-size: 14px;">📊 Form Input</div>
            </div>

            <!-- Form Inputs Container -->
            <div style="
                height: calc(100% - 80px);
                padding: 20px;
                background: #ffffff;
                overflow-y: auto;
            ">
                <form style="display: flex; flex-direction: column; gap: 16px;">
                    <div>
                        <label style="display: block; color: #333; font-weight: bold; margin-bottom: 4px;">Name:</label>
                        <input type="text" placeholder="Enter your name" style="
                            width: 100%; 
                            padding: 8px 12px; 
                            border: 2px solid #4285f4; 
                            font-size: 14px;
                            box-sizing: border-box;
                        ">
                    </div>
                    <div>
                        <label
                            style="display: block; color: #333; font-weight: bold; margin-bottom: 4px;">Password:</label>
                        <input type="password" placeholder="Enter your password" style="
                            width: 100%; 
                            padding: 8px 12px; 
                            border: 2px solid #4285f4; 
                            font-size: 14px;
                            box-sizing: border-box;
                        ">
                    </div>

                    <div>
                        <label
                            style="display: block; color: #333; font-weight: bold; margin-bottom: 4px;">Email:</label>
                        <input type="text" placeholder="your.email@example.com" style="
                            width: 100%; 
                            padding: 8px 12px; 
                            border: 2px solid #4285f4; 
                            font-size: 14px;
                            box-sizing: border-box;
                        ">
                    </div>

                    <div>
                        <label style="display: block; color: #333; font-weight: bold; margin-bottom: 4px;">VR
                            Experience:</label>
                        <select style="
                            width: 100%; 
                            padding: 8px 12px; 
                            border: 2px solid #4285f4; 
                            font-size: 14px;
                            box-sizing: border-box;
                        ">
                            <option>Beginner</option>
                            <option>Intermediate</option>
                            <option>Advanced</option>
                            <option>Expert</option>
                        </select>
                    </div>

                    <div>
                        <label style="display: block; color: #333; font-weight: bold; margin-bottom: 4px;">Favorite VR
                            Features:</label>
                        <div style="display: flex; flex-direction: column; gap: 8px;">
                            <label style="display: flex; align-items: center; gap: 8px; color: #333;">
                                <input type="checkbox"> Hand Tracking
                            </label>
                            <label style="display: flex; align-items: center; gap: 8px; color: #333;">
                                <input type="checkbox"> Voice Commands
                            </label>
                            <label style="display: flex; align-items: center; gap: 8px; color: #333;">
                                <input type="checkbox"> Spatial Audio
                            </label>
                            <label style="display: flex; align-items: center; gap: 8px; color: #333;">
                                <input type="checkbox"> Haptic Feedback
                            </label>
                        </div>
                    </div>


                    <div style="display: flex; gap: 12px;">
                        <button type="submit" style="
                            flex: 1;
                            background: #4285f4;
                            color: white;
                            border: none;
                            padding: 12px 16px;
                            font-size: 14px;
                            font-weight: bold;
                            cursor: pointer;
                        " onmouseover="this.style.background='#1a73e8'" onmouseout="this.style.background='#4285f4'">
                            🚀 Submit
                        </button>
                        <button type="reset" style="
                            flex: 1;
                            background: #f8f9fa;
                            color: #333;
                            border: 2px solid #dadce0;
                            padding: 12px 16px;
                            font-size: 14px;
                            cursor: pointer;
                        " onmouseover="this.style.background='#e8eaed'" onmouseout="this.style.background='#f8f9fa'">
                            🔄 Reset
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- DOM Overlay -->
        <div id="dom-overlay">
            <h1>
                Hello World
            </h1>
            <div class="overlay-footer">
                <section
                    style="display: inline-block; color: #333333; border-radius: 1em; padding: 1em; margin:0; accent-color: hotpink;"
                    id="my-interface">
                    <h2>Settings</h2>
                    <fieldset style="border:none;">
                        <legend>Thumbstick Behaviour</legend>
                        <input onclick="toggleThumbstick(this)" type="radio" id="thumbstick-teleport" name="thumbstick"
                            value="teleport" checked><label for="thumbstick-teleport"> Teleport</label>
                        <input onclick="toggleThumbstick(this)" type="radio" id="thumbstick-move" name="thumbstick"
                            value="move"><label for="thumbstick-move"> Move</label>
                    </fieldset>
                    <button onclick="AFRAME.scenes[0].exitVR()" style="display: block;">Exit Immersive</button>
                </section>

                <!-- HTML form logic -->
                <script>
                    let movementType = 'teleport';
                    function toggleThumbstick(detail) {
                        const rayPointers = ['[data-right="ray"]', '[data-left="ray"]'].map(s => document.querySelector(s));
                        const type = detail.value;
                        movementType = type;
                        if (type === 'move') {
                            cameraRig.setAttribute('movement-controls', 'enabled', true);
                            for (const p of rayPointers) p.removeAttribute('mixin');
                        }
                        if (type === 'teleport') {
                            cameraRig.setAttribute('movement-controls', 'enabled', false);
                            for (const p of rayPointers) p.setAttribute('mixin', 'blink');
                        }
                    }
                    // If the user is teleporting disable movement-controls in XR
                    const sceneEl = document.querySelector("a-scene");
                    sceneEl.addEventListener("enter-vr", function () {
                        if (movementType === 'teleport') {
                            cameraRig.setAttribute('movement-controls', 'enabled', false);
                        }
                    });
                    sceneEl.addEventListener("exit-vr", function () {
                        cameraRig.setAttribute('movement-controls', 'enabled', true);
                    });
                </script>
                <div id="dom-overlay-message">Enter AR or VR to start.</div>
            </div>
        </div>


    </body>

</html>
