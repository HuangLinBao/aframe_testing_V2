<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>C_Center test ||</title>
        <link rel="stylesheet" href="style.css">

        <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
        <script>
            delete AFRAME.components["grabbable"];
        </script>
        <script src="https://cdn.jsdelivr.net/npm/handy-work/build/handy-controls.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/handy-work/build/magnet-helpers.min.js"></script>
        <script
            src="https://unpkg.com/aframe-environment-component@1.5.x/dist/aframe-environment-component.min.js"></script>

        <script src="https://unpkg.com/aframe-troika-text/dist/aframe-troika-text.min.js"></script>
        <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>
        <script src="https://unpkg.com/super-hands@^3.0.5/dist/super-hands.min.js"></script>
        <script
            src="https://unpkg.com/aframe-event-set-component@5.0.0/dist/aframe-event-set-component.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/aframe-blink-controls/dist/aframe-blink-controls.min.js"></script>
        <script
            src="https://unpkg.com/aframe-render-order-component@1.1.0/dist/aframe-render-order-component.min.js"></script>
        <script src="https://unpkg.com/aframe-log-component/dist/aframe-log-component.min.js"></script>

        <script src="https://unpkg.com/aframe-look-at-component@^1.0.0/dist/aframe-look-at-component.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/aframe-htmlmesh@2.4.0/build/aframe-html.min.js"></script>
        <script src="components/fx.js"></script>
        <script src="components/super-integration.js"></script>
        <script src="shaders/aurora-shader.js"></script>
        <script>
            window.addEventListener("DOMContentLoaded", function () {
                const sceneEl = document.querySelector("a-scene");

                const labels = Array.from(document.querySelectorAll('.pose-label'));
                for (const el of labels) {
                    el.parentNode.addEventListener('pose', function (event) {
                        el.setAttribute('text', 'value', event.detail.pose);
                    });
                    el.parentNode.addEventListener('gamepad', function (event) {
                        el.setAttribute('text', 'value', event.detail.event);
                    });
                }

            });




            // Hand tracking quality monitor
            AFRAME.registerComponent('hand-quality-monitor', {
                init: function () {
                    this.leftHandVisible = false;
                    this.rightHandVisible = false;
                    this.leftHandQuality = 'unknown';
                    this.rightHandQuality = 'unknown';

                    console.log('👁️ Hand quality monitor initialized');
                    // addDebugMessage will be available after show-hand-pose component initializes
                },

                tick: function () {
                    var scene = document.querySelector('a-scene');
                    if (!scene.is('vr-mode') || !scene.renderer.xr.isPresenting) return;

                    var session = scene.renderer.xr.getSession();
                    var frame = scene.frame;
                    var referenceSpace = scene.renderer.xr.getReferenceSpace();

                    if (!session || !frame || !referenceSpace) return;

                    for (var inputSource of session.inputSources) {
                        if (inputSource.hand) {
                            var handedness = inputSource.handedness;
                            var wrist = frame.getJointPose(inputSource.hand.get("wrist"), referenceSpace);

                            if (wrist) {
                                // Check hand distance from headset (approximate)
                                var distance = Math.sqrt(
                                    wrist.transform.position.x * wrist.transform.position.x +
                                    wrist.transform.position.y * wrist.transform.position.y +
                                    wrist.transform.position.z * wrist.transform.position.z
                                );

                                var quality = 'Good';
                                if (distance < 0.25) quality = 'Too Close';
                                else if (distance > 0.8) quality = 'Too Far';
                                else if (wrist.transform.position.x > 0.4 || wrist.transform.position.x < -0.4) quality = 'Off Center';

                                if (handedness === 'left') {
                                    var prevQuality = this.leftHandQuality;
                                    this.leftHandVisible = true;
                                    this.leftHandQuality = quality;

                                    // Log quality changes to VR display
                                    if (prevQuality !== quality && quality !== 'Good' && window.addDebugMessage) {
                                        window.addDebugMessage('LEFT hand: ' + quality + ' (dist: ' + distance.toFixed(2) + 'm)', 'warn');
                                    }
                                } else {
                                    var prevQuality = this.rightHandQuality;
                                    this.rightHandVisible = true;
                                    this.rightHandQuality = quality;

                                    // Log quality changes to VR display
                                    if (prevQuality !== quality && quality !== 'Good' && window.addDebugMessage) {
                                        window.addDebugMessage('RIGHT hand: ' + quality + ' (dist: ' + distance.toFixed(2) + 'm)', 'warn');
                                    }
                                }
                            } else {
                                if (handedness === 'left') this.leftHandVisible = false;
                                else this.rightHandVisible = false;
                            }
                        }
                    }
                }
            });

            AFRAME.registerComponent('show-hand-pose', {
                init: function () {
                    var rightRay = document.querySelector('#rightRay');
                    var leftRay = document.querySelector('#leftRay');
                    var poseDisplayEl = document.querySelector('#handPoseDisplay');
                    var leftPoseDisplayEl = document.querySelector('#leftHandPoseDisplay');
                    var rightPoseDisplayEl = document.querySelector('#rightHandPoseDisplay');

                    var leftPose = 'none';
                    var rightPose = 'none';
                    var debugLog = [];
                    var maxLogEntries = 8;

                    // Function to add debug messages to VR displays
                    function addDebugMessage(message, type = 'info') {
                        var timestamp = new Date().toLocaleTimeString();
                        var emoji = type === 'warn' ? '⚠️' : type === 'error' ? '❌' : 'ℹ️';
                        var logEntry = '[' + timestamp + '] ' + emoji + ' ' + message;

                        debugLog.unshift(logEntry);
                        if (debugLog.length > maxLogEntries) {
                            debugLog.pop();
                        }
                        updateDebugDisplays();
                    }

                    // Make addDebugMessage globally available
                    window.addDebugMessage = addDebugMessage;

                    function updateDebugDisplays() {
                        var leftLogEl = document.querySelector('#leftDebugLog');
                        var rightLogEl = document.querySelector('#rightDebugLog');
                        var mainLogEl = document.querySelector('#mainDebugLog');

                        if (leftLogEl && rightLogEl && mainLogEl) {
                            var logText = debugLog.join('\n');

                            leftLogEl.setAttribute('troika-text', 'value',
                                '📝 LEFT HAND DEBUG LOG:\n\n' + logText);
                            rightLogEl.setAttribute('troika-text', 'value',
                                '📝 RIGHT HAND DEBUG LOG:\n\n' + logText);
                            mainLogEl.setAttribute('troika-text', 'value',
                                '📊 LIVE DEBUG CONSOLE:\n\n' + logText);
                        }
                    }

                    var poseDescriptions = {
                        fist: '✊ Fist',
                        flat: '✋ Open Palm',
                        point: '👉 Pointing',
                        horns: '🤘 Rock On',
                        shaka: '🤙 Hang Loose',
                        vulcan: '🖖 Live Long & Prosper',
                        relax: '👋 Relaxed',
                        none: '❓ No pose',
                        unknown: '❓ Unknown'
                    };

                    function updateLeftPose(event) {
                        leftPose = (event.detail && event.detail.pose) ? event.detail.pose : 'unknown';
                        var description = poseDescriptions[leftPose] || leftPose;
                        var timestamp = new Date().toLocaleTimeString();
                        var confidence = event.detail && event.detail.confidence ? event.detail.confidence.toFixed(3) : 'N/A';

                        // Update left panel with more debug info
                        leftPoseDisplayEl.setAttribute('troika-text', 'value',
                            '👈 Left Hand [' + timestamp + ']\n\n' + description +
                            '\nConfidence: ' + confidence);

                        // Update main panel with both poses
                        updateMainDisplay();

                        console.log('🎯 LEFT HAND POSE:', leftPose, 'Confidence:', confidence);
                        addDebugMessage('LEFT: ' + leftPose + ' (conf: ' + confidence + ')');

                        // Special debugging for common false positives
                        if (leftPose === 'vulcan' && confidence !== 'N/A' && parseFloat(confidence) < 0.8) {
                            var warnMsg = 'LOW CONFIDENCE VULCAN - might be false positive. Try fully relaxing all fingers.';
                            console.warn('⚠️ ' + warnMsg);
                            addDebugMessage('LEFT: ' + warnMsg, 'warn');
                        }
                        if (leftPose === 'flat' && confidence !== 'N/A' && parseFloat(confidence) < 0.7) {
                            var warnMsg = 'LOW CONFIDENCE FLAT - try spreading fingers more clearly and evenly.';
                            console.warn('⚠️ ' + warnMsg);
                            addDebugMessage('LEFT: ' + warnMsg, 'warn');
                        }
                    }

                    function updateRightPose(event) {
                        rightPose = (event.detail && event.detail.pose) ? event.detail.pose : 'unknown';
                        var description = poseDescriptions[rightPose] || rightPose;
                        var timestamp = new Date().toLocaleTimeString();
                        var confidence = event.detail && event.detail.confidence ? event.detail.confidence.toFixed(3) : 'N/A';

                        // Update right panel with more debug info
                        rightPoseDisplayEl.setAttribute('troika-text', 'value',
                            '👉 Right Hand [' + timestamp + ']\n\n' + description +
                            '\nConfidence: ' + confidence);

                        // Update main panel with both poses
                        updateMainDisplay();

                        console.log('🎯 RIGHT HAND POSE:', rightPose, 'Confidence:', confidence);
                        addDebugMessage('RIGHT: ' + rightPose + ' (conf: ' + confidence + ')');

                        // Special debugging for common false positives
                        if (rightPose === 'vulcan' && confidence !== 'N/A' && parseFloat(confidence) < 0.8) {
                            var warnMsg = 'LOW CONFIDENCE VULCAN - might be false positive. Try fully relaxing all fingers.';
                            console.warn('⚠️ ' + warnMsg);
                            addDebugMessage('RIGHT: ' + warnMsg, 'warn');
                        }
                        if (rightPose === 'flat' && confidence !== 'N/A' && parseFloat(confidence) < 0.7) {
                            var warnMsg = 'LOW CONFIDENCE FLAT - try spreading fingers more clearly and evenly.';
                            console.warn('⚠️ ' + warnMsg);
                            addDebugMessage('RIGHT: ' + warnMsg, 'warn');
                        }
                    }



                    function updateMainDisplay() {
                        var leftDesc = poseDescriptions[leftPose] || leftPose;
                        var rightDesc = poseDescriptions[rightPose] || rightPose;
                        var timestamp = new Date().toLocaleTimeString();
                        var qualityMonitor = document.querySelector('a-scene').components['hand-quality-monitor'];

                        var message = '🙌 Hand Tracking Debug [' + timestamp + ']\n\n';
                        message += '👈 Left: ' + leftDesc + '\n';
                        message += '👉 Right: ' + rightDesc;

                        // Add hand tracking quality info
                        message += '\n\n--- Tracking Quality ---';
                        if (qualityMonitor) {
                            message += '\n👈 LEFT: ' + (qualityMonitor.leftHandVisible ? qualityMonitor.leftHandQuality : 'Not Visible');
                            message += '\n👉 RIGHT: ' + (qualityMonitor.rightHandVisible ? qualityMonitor.rightHandQuality : 'Not Visible');
                        }

                        poseDisplayEl.setAttribute('troika-text', 'value', message);
                    }

                    // Set up event listeners
                    if (rightRay) {
                        rightRay.addEventListener('pose', updateRightPose);
                        console.log('✅ Right hand pose listener added');
                    } else {
                        console.log('❌ Right ray not found');
                    }

                    if (leftRay) {
                        leftRay.addEventListener('pose', updateLeftPose);
                        console.log('✅ Left hand pose listener added');
                    } else {
                        console.log('❌ Left ray not found');
                    }

                    console.log('🎯 Hand pose tracking initialized for both hands');
                    addDebugMessage('Hand pose tracking initialized');

                    // Set up VR mode detection
                    this.el.sceneEl.addEventListener('enter-vr', function () {
                        console.log('🎯 VR mode started');
                        addDebugMessage('VR mode started');
                    });

                    // Set up super-hands event debugging
                    this.setupSuperHandsDebug();
                },

                setupSuperHandsDebug: function () {
                    // Simplified debug - just listen for super-hands events (emission is handled by super-integration component)
                    const grabbableEntities = document.querySelectorAll('.grabbable');
                    const stretchableEntities = document.querySelectorAll('.stretchable');

                    // Listen for grab events on all grabbable entities
                    grabbableEntities.forEach(entity => {
                        entity.addEventListener('hover-start', function (event) {
                            console.log('🎯 SUPER-HANDS: hover-start on', entity.id, event.detail);
                            if (window.addDebugMessage) {
                                window.addDebugMessage('🎯 HOVER START: ' + entity.id);
                            }
                        });

                        entity.addEventListener('hover-end', function (event) {
                            console.log('🎯 SUPER-HANDS: hover-end on', entity.id, event.detail);
                            if (window.addDebugMessage) {
                                window.addDebugMessage('🎯 HOVER END: ' + entity.id);
                            }
                        });

                        entity.addEventListener('grab-start', function (event) {
                            console.log('✊ SUPER-HANDS: grab-start on', entity.id, event.detail);
                            if (window.addDebugMessage) {
                                window.addDebugMessage('✊ GRAB START: ' + entity.id + ' by ' + (event.detail.hand ? event.detail.hand.id : 'unknown'));
                            }
                        });

                        entity.addEventListener('grab-end', function (event) {
                            console.log('👐 SUPER-HANDS: grab-end on', entity.id, event.detail);
                            if (window.addDebugMessage) {
                                window.addDebugMessage('👐 GRAB END: ' + entity.id + ' by ' + (event.detail.hand ? event.detail.hand.id : 'unknown'));
                            }
                        });
                    });

                    // Listen for stretch events on all stretchable entities
                    stretchableEntities.forEach(entity => {
                        entity.addEventListener('stretch-start', function (event) {
                            console.log('✋✋ SUPER-HANDS: stretch-start on', entity.id, event.detail);
                            if (window.addDebugMessage) {
                                window.addDebugMessage('✋✋ STRETCH START: ' + entity.id);
                            }
                        });

                        entity.addEventListener('stretch-end', function (event) {
                            console.log('👐👐 SUPER-HANDS: stretch-end on', entity.id, event.detail);
                            if (window.addDebugMessage) {
                                window.addDebugMessage('👐👐 STRETCH END: ' + entity.id);
                            }
                        });
                    });

                    console.log('🔧 Super-hands debug listeners set up for', grabbableEntities.length, 'grabbable and', stretchableEntities.length, 'stretchable entities');
                    if (window.addDebugMessage) {
                        window.addDebugMessage('🔧 Super-hands debug ready (via super-integration)');
                    }
                }
            });



            // Debug component for ray intersection
            AFRAME.registerComponent('ray-debug', {
                init: function () {
                    // Listen for raycaster intersection events on this ray
                    this.el.addEventListener('raycaster-intersection', (event) => {
                        console.log('🎯 Ray intersection detected:', event.detail);
                        if (window.addDebugMessage) {
                            window.addDebugMessage('🎯 Ray intersection detected');
                        }
                    });

                    this.el.addEventListener('raycaster-intersection-cleared', (event) => {
                        console.log('🎯 Ray intersection cleared:', event.detail);
                    });

                    // Monitor raycaster component directly
                    this.raycaster = this.el.components.raycaster;
                    if (this.raycaster) {
                        console.log('✅ Ray debug component found raycaster on:', this.el.id);
                        if (window.addDebugMessage) {
                            window.addDebugMessage('✅ Ray debug found raycaster on ' + this.el.id);
                        }
                    } else {
                        console.log('❌ Ray debug component could not find raycaster on:', this.el.id);
                        if (window.addDebugMessage) {
                            window.addDebugMessage('❌ No raycaster found on ' + this.el.id, 'warn');
                        }
                    }
                },

                tick: function () {
                    if (this.raycaster && this.raycaster.intersectedEls && this.raycaster.intersectedEls.length > 0) {
                        // Only log once per intersection to avoid spam
                        if (!this.lastIntersection || this.lastIntersection !== this.raycaster.intersectedEls[0].id) {
                            this.lastIntersection = this.raycaster.intersectedEls[0].id;
                            console.log('🔍 ' + this.el.id + ' intersecting:', this.lastIntersection);
                            if (window.addDebugMessage) {
                                window.addDebugMessage('🔍 ' + this.el.id + ' → ' + this.lastIntersection);
                            }
                        }
                    } else {
                        if (this.lastIntersection) {
                            this.lastIntersection = null;
                        }
                    }
                }
            });
        </script>

    </head>

    <body>
        <a-scene
            environment=" preset:default;ground: flat; groundTexture: none; lighting: distant; shadow: false; fog: 0.1"
            renderer="antialias: true" loading-screen="enabled: false" vr-mode-ui="enterVRButton: #enter-vr-button"
            webxr="optionalFeatures: hand-tracking,local-floor; overlayElement:#dom-overlay;" show-hand-pose
            hand-quality-monitor ar-cursor super-integration="rightRay: #rightRay; leftRay: #leftRay; debug: true">

            <a-assets timeout="10000">

                <!-- Models -->
                <a-asset-item id="sword" src="assets/models/sword/scene.gltf" preload="true"></a-asset-item>
                <a-asset-item id="chaos_orb" src="assets/models/chaos_orb/scene.gltf" preload="true"></a-asset-item>
                <a-asset-item id="magical_orb" src="assets/models/magical_orb/scene.gltf" preload="true"></a-asset-item>
                <a-asset-item id="time_chamber" src="assets/models/time_chamber/scene.gltf"
                    preload="true"></a-asset-item>
                <a-asset-item id="watch" src="assets/models/watch/scene.glb" preload="true"></a-asset-item>

                <!-- Textures -->
                <!-- Floor -->

                <img id="floor_glass" src="assets/img/textures/Glass_webp/TCom_GlassFrostedLines_1K_albedo.webp">
                <img id="floor_glass_nrm" src="assets/img/textures/Glass_webp/TCom_GlassFrostedLines_1K_normal.webp">
                <img id="floor_glass_ao" src="assets/img/textures/Glass_webp/TCom_GlassFrostedLines_1K_ao.webp">
                <img id="floor_glass_height" src="assets/img/textures/Glass_webp/TCom_GlassFrostedLines_1K_height.webp">
                <img id="floor_glass_roughness"
                    src="assets/img/textures/Glass_webp/TCom_GlassFrostedLines_1K_roughness.webp">
                <img id="floor_glass_metallic"
                    src="assets/img/textures/Glass_webp/TCom_GlassFrostedLines_1K_metallic.webp">

                <!-- Fonts -->
                <a-asset-item id="pixel-ar" src="assets/Fonts/29LT_Arapix/29LTArapix-Regular.otf"></a-asset-item>

                <!-- Templates for super-hands -->
                <template id="button-template">
                    <a-entity>
                        <a-box class="clickable" width="0.2" height="0.08" depth="0.01"></a-box>
                    </a-entity>
                </template>
            </a-assets>

            <!-- Floor -->
            <a-plane material="src: #floor_glass;
                repeat: 27 27;
                normalMap: #floor_glass_nrm;
                normalTextureRepeat: 27 27;
                ambientOcclusionMap: #floor_glass_ao;
                ambientOcclusionTextureRepeat: 27 27;
                displacementMap: #floor_glass_height;
                displacementTextureRepeat: 27 27;
                displacementBias: -0.02;
                displacementScale: 0.05;
                roughnessMap: #floor_glass_roughness;
                roughnessTextureRepeat: 27 27;
                roughness: 0.7;
                opacity: 0.8;
                metalnessMap: #floor_glass_metallic;
                metalness: 0.1;
                metalnessTextureRepeat: 27 27;
                emissive: #2e2e2e;
                color: #949494;
                side: double" width="67.5" height="67.5" position="0 0.02 0" scale="3 3 1" rotation="-90 0 0">
            </a-plane>

            <!-- Aurora Sky -->
            <a-entity position="0 35.000 0" geometry="primitive: box; width: 67.5; height: 67.5; depth: 67.5;" material="shader: aurora-shader; 
                                transparent: false; 
                                side: back;
                                iTime: 0;
                                iResolution: 2048 2048;
                                iMouse: 1024 1024;" aurora-animator scale="3 3 3"></a-entity>

            <!-- Environment -->
            <!-- Time Chamber -->
            <a-entity id="time_chamber" gltf-model="#time_chamber" position="0 0.00 45" visible="true"
                rotation="0 -150 0" scale="0.2 0.2 0.2"></a-entity>

            <!-- Main Pose Display -->
            <a-entity id="handPoseDisplay" geometry="primitive: plane; width: 1.2; height: 1.2"
                material="color: #000022; opacity: 0.9; transparent: true; side: double" position="0 1.8 -3"
                troika-text="value: Initializing...; 
                           color: #00ff88; 
                           fontSize: 0.06; 
                           align: center; 
                           baseline: center;
                           maxWidth: 1.1;
                           depthOffset: -0.4;" look-at="[camera]">
            </a-entity>

            <!-- Left Hand Pose Display -->
            <a-entity id="leftHandPoseDisplay" geometry="primitive: plane; width: 1.0; height: 0.5"
                material="color: #002200; opacity: 0.9; transparent: true; side: double" position="-1.5 1.8 -3.5"
                troika-text="value: 👈 Left Hand\n\nWaiting for pose...; 
                           color: #00ff88; 
                           fontSize: 0.05; 
                           align: center; 
                           baseline: center;
                           maxWidth: 0.9;
                           depthOffset: -0.4;" look-at="[camera]">
            </a-entity>

            <!-- Right Hand Pose Display -->
            <a-entity id="rightHandPoseDisplay" geometry="primitive: plane; width: 1.0; height: 0.5"
                material="color: #220000; opacity: 0.9; transparent: true; side: double" position="1.5 1.8 -3.5"
                troika-text="value: 👉 Right Hand\n\nWaiting for pose...; 
                           color: #00ff88; 
                           fontSize: 0.05; 
                           align: center; 
                           baseline: center;
                           maxWidth: 0.9;
                           depthOffset: -0.4;" look-at="[camera]">
            </a-entity>

            <!-- Debug Log Displays (Below main displays) -->
            <!-- Left Hand Debug Log -->
            <a-entity id="leftDebugLog" geometry="primitive: plane; width: 1.0; height: 0.8"
                material="color: #001100; opacity: 0.9; transparent: true; side: double" position="-1.8 0.8 0"
                troika-text="value: 📝 LEFT HAND DEBUG LOG:\n\nInitializing...; 
                           color: #88ff88; 
                           fontSize: 0.04; 
                           align: left; 
                           baseline: center;
                           maxWidth: 0.95;
                           depthOffset: -0.4;" look-at="[camera]">
            </a-entity>

            <!-- Right Hand Debug Log -->
            <a-entity id="rightDebugLog" geometry="primitive: plane; width: 1.0; height: 0.8"
                material="color: #110000; opacity: 0.9; transparent: true; side: double" position="1.8 0.8 0"
                troika-text="value: 📝 RIGHT HAND DEBUG LOG:\n\nInitializing...; 
                           color: #ff8888; 
                           fontSize: 0.04; 
                           align: left; 
                           baseline: center;
                           maxWidth: 0.95;
                           depthOffset: -0.4;" look-at="[camera]">
            </a-entity>

            <!-- Main Debug Console Log -->
            <a-entity id="mainDebugLog" geometry="primitive: plane; width: 1.2; height: 0.8"
                material="color: #001122; opacity: 0.9; transparent: true; side: double" position="0 0.8 -1.8"
                troika-text="value: 📊 LIVE DEBUG CONSOLE:\n\nInitializing...; 
                           color: #88ddff; 
                           fontSize: 0.04; 
                           align: left; 
                           baseline: center;
                           maxWidth: 1.15;
                           depthOffset: -0.4;" look-at="[camera]">
            </a-entity>

            <!-- Sword -->


            <!-- Quest 3 Specific Help Panel -->
            <a-entity id="quest-help-panel" geometry="primitive: plane; width: 1.8; height: 1.2"
                material="color: #001122; opacity: 0.9; transparent: true; side: double" position="-1.8 1.8 -3"
                rotation="0 15 -3" troika-text="value: 📱 QUEST 3 HAND TRACKING TIPS:\n\n🔍 VULCAN FALSE POSITIVE:\n• Fully relax ALL fingers\n• Don't curl pinky/ring finger\n• Keep hand centered in view\n\n✋ FLAT PALM DETECTION:\n• Spread fingers wide & even\n• Keep palm facing cameras\n• Avoid hand shadows\n• Don't tilt hand too much\n\n📏 OPTIMAL DISTANCE:\n• 30-60cm from headset\n• Both hands in camera view\n• Good lighting on hands;
                    color: #00ff88;
                    fontSize: 0.045;
                    align: center;
                    baseline: center;
                    maxWidth: 1.7;
                    depthOffset: -0.4;" look-at='[camera]'>
            </a-entity>

            <!-- Pinch Status Indicators (dynamic, like the main debug panel) -->
            <a-entity id="pinch-status-text" geometry="primitive: plane; width: 2.2; height: 1.4"
                material="color: #001122; opacity: 0.92; transparent: true; side: double" position="1.8 1.8 -3"

                            font-weight: bold;
                            cursor: pointer;
                        " onmouseover="this.style.background='#1a73e8'" onmouseout="this.style.background='#4285f4'">
                            🚀 Submit
                        </button>
                        <button type="reset" style="
                            flex: 1;
                            background: #f8f9fa;
                            color: #333;
                            border: 2px solid #dadce0;
                            padding: 12px 16px;
                            font-size: 14px;
                            cursor: pointer;
                        " onmouseover="this.style.background='#e8eaed'" onmouseout="this.style.background='#f8f9fa'">
                            🔄 Reset
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- DOM Overlay -->
        <div id="dom-overlay">
            <h1>
                Hello World
            </h1>
            <div class="overlay-footer">
                <section
                    style="display: inline-block; background: lavenderblush; color: #333333; border-radius: 1em; padding: 1em; margin:0; accent-color: hotpink;"
                    id="my-interface">
                    <h2>Settings</h2>
                    <fieldset style="border:none;">
                        <legend>Thumbstick Behaviour</legend>
                        <input onclick="toggleThumbstick(this)" type="radio" id="thumbstick-teleport" name="thumbstick"
                            value="teleport" checked><label for="thumbstick-teleport"> Teleport</label>
                        <input onclick="toggleThumbstick(this)" type="radio" id="thumbstick-move" name="thumbstick"
                            value="move"><label for="thumbstick-move"> Move</label>
                    </fieldset>
                    <button onclick="AFRAME.scenes[0].exitVR()" style="display: block;">Exit Immersive</button>
                </section>

                <!-- HTML form logic -->
                <script>
                    let movementType = 'teleport';
                    function toggleThumbstick(detail) {
                        const rayPointers = ['[data-right="ray"]', '[data-left="ray"]'].map(s => document.querySelector(s));
                        const type = detail.value;
                        movementType = type;
                        if (type === 'move') {
                            cameraRig.setAttribute('movement-controls', 'enabled', true);
                            for (const p of rayPointers) p.removeAttribute('mixin');
                        }
                        if (type === 'teleport') {
                            cameraRig.setAttribute('movement-controls', 'enabled', false);
                            for (const p of rayPointers) p.setAttribute('mixin', 'blink');
                        }
                    }
                    // If the user is teleporting disable movement-controls in XR
                    const sceneEl = document.querySelector("a-scene");
                    sceneEl.addEventListener("enter-vr", function () {
                        if (movementType === 'teleport') {
                            cameraRig.setAttribute('movement-controls', 'enabled', false);
                        }
                    });
                    sceneEl.addEventListener("exit-vr", function () {
                        cameraRig.setAttribute('movement-controls', 'enabled', true);
                    });
                </script>
                <div id="dom-overlay-message">Enter AR or VR to start.</div>
            </div>
        </div>


    </body>

</html>
